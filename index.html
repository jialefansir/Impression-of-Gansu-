  <style type="text/tailwindcss">
    @layer utilities {
      .scrollbar-none::-webkit-scrollbar { display: none; }

      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-deep {
        background: rgba(12, 12, 14, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .img-filter {
        filter: saturate(0.85) contrast(0.95) brightness(0.9);
      }
      .smooth-transition {
        transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .text-shadow {
        text-shadow: 0 2px 20px rgba(0,0,0,0.5);
      }
      .gradient-overlay {
        background: linear-gradient(to top, rgba(12,12,14,0.8) 0%, rgba(12,12,14,0.2) 40%, transparent 100%);
      }
      .spot-card:hover .spot-img {
        transform: scale(1.05);
      }

        opacity: 1;
      }

        opacity: 0;

        background: #b4a484;

      }
      .fade-in {
        animation: fadeIn 0.8s ease forwards;
      }

        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .slide-up {
        animation: slideUp 0.6s ease forwards;
      }
      @keyframes slideUp {
        from { opacity: 0; transform: translateY(40px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

      background-color: #0c0c0e;

        // 创建指示点
        const dot = document.createElement("button");
        dot.className = `carousel-dot w-2 h-2 rounded-full smooth-transition ${idx === 0 ? 'active' : 'bg-white/30'}`;
        dot.onclick = () => goToSlide(idx);
        carouselDots.appendChild(dot);
      });

      // 绑定图片点击事件
      document.querySelectorAll('.carousel-item img').forEach(img => {
        img.addEventListener('click', (e) => {
          const cityKey = e.target.dataset.city;
          openCityModal(cityKey);
        });
      });
    }

    function updateHeroText() {
      const city = cityData[cityKeys[currentIndex]];
      heroTitle.textContent = city.name;
      heroDesc.textContent = currentLang === "en" ? city.subtitle : city.subtitleCn;
      heroSubtitle.textContent = currentLang === "en" ? "Discover Gansu" : "探索甘肃";

      // 重新触发动画
      heroTitle.classList.remove('fade-in');
      heroDesc.classList.remove('fade-in');
      void heroTitle.offsetWidth; // 触发重排
      heroTitle.classList.add('fade-in');
      heroDesc.classList.add('fade-in');
    }

    function goToSlide(index) {
      if (index < 0) index = total - 1;
      if (index >= total) index = 0;
      currentIndex = index;

      const items = document.querySelectorAll(".carousel-item");
      items.forEach((item, idx) => {
        item.style.opacity = idx === currentIndex ? "1" : "0";
        item.style.pointerEvents = idx === currentIndex ? "auto" : "none";
        item.style.zIndex = idx === currentIndex ? "1" : "0";
      });

      // 更新指示点
      const dots = document.querySelectorAll(".carousel-dot");
      dots.forEach((dot, idx) => {
        if (idx === currentIndex) {
          dot.classList.add('active');
          dot.classList.remove('bg-white/30');
        } else {
          dot.classList.remove('active');
          dot.classList.add('bg-white/30');
        }
      });

      updateHeroText();
    }

    function nextSlide() { goToSlide(currentIndex + 1); }
    function prevSlide() { goToSlide(currentIndex - 1); }

    // 翻页事件
    document.getElementById("nextBtn").addEventListener("click", nextSlide);
    document.getElementById("prevBtn").addEventListener("click", prevSlide);

    // 键盘支持
    document.addEventListener("keydown", (e) => {
      if (heroPaused) return;
      if (e.key === "ArrowRight") nextSlide();
      if (e.key === "ArrowLeft") prevSlide();
    });

    // 触摸支持
    const heroSection = document.getElementById("heroSection");
    heroSection.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].screenX; });
    heroSection.addEventListener("touchend", (e) => {
      if (heroPaused) return;
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 50) nextSlide();
      if (touchEndX - touchStartX > 50) prevSlide();
    });

    // 自动轮播
    function startAutoPlay() {
      if (heroPaused) return;
      autoPlayInterval = setInterval(nextSlide, 6000);
    }
    function stopAutoPlay() {
      if (autoPlayInterval) clearInterval(autoPlayInterval);
    }
    startAutoPlay();
    heroSection.addEventListener("mouseenter", stopAutoPlay);
    heroSection.addEventListener("mouseleave", () => { if (!heroPaused) startAutoPlay(); });

    // ==================== 语言切换函数 ====================
    function switchLang(lang) {
      currentLang = lang;

      // 更新所有语言切换按钮状态
      document.querySelectorAll('.lang-switch, .lang-switch-top, .lang-switch-spot').forEach(btn => {
        if (btn.dataset.lang === lang) {
          btn.style.color = '#b4a484';
          btn.style.border = '1px solid rgba(180,164,132,0.3)';
        } else {
          btn.style.color = '#9494a0';
          btn.style.border = '1px solid rgba(255,255,255,0.1)';
        }
      });

      // 切换所有语言元素 - 修复：使用更可靠的方法
      const allElements = document.querySelectorAll(".lang-en, .lang-cn");
      allElements.forEach(el => {
        if (el.classList.contains('lang-en')) {
          el.style.display = lang === "en" ? "" : "none";
        }
        if (el.classList.contains('lang-cn')) {
          el.style.display = lang === "cn" ? "" : "none";
        }
      });

      // 更新hero文字
      updateHeroText();

      // 如果城市弹窗打开，重新渲染
      const cityModal = document.getElementById("cityModal");
      if (cityModal.style.pointerEvents === "auto" && activeCityKey) {
        renderDetail(cityData[activeCityKey]);
      }

      // 如果景点详情打开，重新渲染
      const spotModal = document.getElementById("spotDetailModal");
      if (spotModal.style.pointerEvents === "auto" && activeSpotKey && activeCityKey) {
        const spot = cityData[activeCityKey].spots.find(s => s.key === activeSpotKey);
        if (spot) renderSpotDetail(spot);
      }
    }

    // 绑定语言切换按钮 - 修复：确保所有按钮都能正确触发
    function bindLangSwitch() {
      document.querySelectorAll('.lang-switch, .lang-switch-top, .lang-switch-spot').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          switchLang(e.target.dataset.lang);
        });
      });
    }

    // ==================== 渲染城市详情 ====================
    function renderDetail(data) {
      const modalContent = document.getElementById("modalContent");

      const enFoodList = data.food.en.map(item => `<p class="text-sm text-insMuted">&bull; ${item}</p>`).join("");
      const cnFoodList = data.food.cn.map(item => `<p class="text-sm text-insMuted">&bull; ${item}</p>`).join("");

      const spotHtml = data.spots.map((s, idx) => `
        <div class="spot-card glass rounded-xl overflow-hidden cursor-pointer smooth-transition group" 
             onclick="openSpotDetail('${s.key}')" style="animation: slideUp 0.5s ease ${idx * 0.1}s forwards; opacity: 0;">
          <div class="relative overflow-hidden aspect-[4/3]">
            <img src="${s.img}" alt="${s.name}" 
              class="spot-img w-full h-full object-cover smooth-transition"
              onerror="this.src='https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&q=80'" />
            <div class="spot-overlay absolute inset-0 bg-black/40 flex items-center justify-center">
              <span class="text-white text-xs tracking-widest uppercase border border-white/30 px-4 py-2 rounded-full">
                <span class="lang-en">View Details</span>
                <span class="lang-cn">查看详情</span>
              </span>
            </div>
          </div>
          <div class="p-4">
            <h5 class="text-sm font-medium text-white mb-1">
              <span class="lang-en">${s.name}</span>
              <span class="lang-cn">${s.nameCn}</span>
            </h5>
            <p class="text-xs text-insMuted line-clamp-2">
              <span class="lang-en">${s.desc.en}</span>
              <span class="lang-cn">${s.desc.cn}</span>
            </p>
          </div>
        </div>
      `).join("");

      modalContent.innerHTML = `
        <div class="slide-up">
          <h2 class="text-4xl md:text-6xl font-display font-light tracking-widest uppercase mb-2">${data.name}</h2>
          <p class="text-insAccent text-xs tracking-[0.3em] uppercase mb-8">
            <span class="lang-en">${data.subtitle}</span>
            <span class="lang-cn">${data.subtitleCn}</span>
          </p>

          <div class="mb-10">
            <p class="text-insMuted leading-relaxed text-sm md:text-base lang-en">${data.intro.en}</p>
            <p class="text-insMuted leading-relaxed text-sm md:text-base lang-cn">${data.intro.cn}</p>
          </div>

          <div class="grid md:grid-cols-2 gap-4 mb-10">
            <div class="glass p-6 rounded-xl">
              <h4 class="text-xs text-insAccent tracking-[0.2em] mb-4 uppercase flex items-center gap-2">
                <i class="fa fa-briefcase"></i>
                <span class="lang-en">Economic Advantage</span>
                <span class="lang-cn">城市优势</span>
              </h4>
              <p class="text-sm text-insMuted leading-relaxed lang-en">${data.economy.en}</p>
              <p class="text-sm text-insMuted leading-relaxed lang-cn">${data.economy.cn}</p>
            </div>
            <div class="glass p-6 rounded-xl">
              <h4 class="text-xs text-insAccent tracking-[0.2em] mb-4 uppercase flex items-center gap-2">
                <i class="fa fa-cutlery"></i>
                <span class="lang-en">Local Cuisine</span>
                <span class="lang-cn">特色美食</span>
              </h4>
              <div class="space-y-1 lang-en">${enFoodList}</div>
              <div class="space-y-1 lang-cn">${cnFoodList}</div>
            </div>
          </div>

          <div>
            <h4 class="text-xs text-insAccent tracking-[0.2em] mb-6 uppercase flex items-center gap-2">
              <i class="fa fa-map-marker"></i>
              <span class="lang-en">Tourist Attractions</span>
              <span class="lang-cn">旅游景点</span>
            </h4>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${spotHtml}
            </div>
          </div>
        </div>
      `;

      // 立即应用当前语言
      const allElements = document.querySelectorAll(".lang-en, .lang-cn");
      allElements.forEach(el => {
        if (el.classList.contains('lang-en')) {
          el.style.display = currentLang === "en" ? "" : "none";
        }
        if (el.classList.contains('lang-cn')) {
          el.style.display = currentLang === "cn" ? "" : "none";
        }
      });
    }

    // ==================== 打开城市弹窗 ====================
    function openCityModal(cityKey) {
      activeCityKey = cityKey;
      const data = cityData[cityKey];
      const modalBg = document.getElementById("modalBg");
      modalBg.style.backgroundImage = `url(${data.bg})`;
      renderDetail(data);

      const modal = document.getElementById("cityModal");
      modal.style.opacity = "1";
      modal.style.pointerEvents = "auto";
      document.body.style.overflow = "hidden";

      // 暂停轮播
      heroPaused = true;
      stopAutoPlay();

      // 隐藏轮播
      const heroSection = document.getElementById("heroSection");
      heroSection.style.opacity = "0";
      heroSection.style.pointerEvents = "none";
      heroSection.style.transition = "opacity 0.6s ease";
    }

    // 关闭城市弹窗
    document.getElementById("closeModal").addEventListener("click", () => {
      const modal = document.getElementById("cityModal");
      modal.style.opacity = "0";
      modal.style.pointerEvents = "none";
      document.body.style.overflow = "";
      activeCityKey = "";

      // 恢复轮播
      heroPaused = false;
      const heroSection = document.getElementById("heroSection");
      heroSection.style.opacity = "1";
      heroSection.style.pointerEvents = "auto";
      startAutoPlay();
    });

    // ==================== 景点详情页面 ====================
    function renderSpotDetail(spot) {
      const content = document.getElementById("spotDetailContent");

      content.innerHTML = `
        <div class="slide-up">
          <div class="relative rounded-2xl overflow-hidden mb-8 aspect-[21/9]">
            <img src="${spot.img}" alt="${spot.name}" 
              class="w-full h-full object-cover img-filter"
              onerror="this.src='https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1200&q=80'" />
            <div class="absolute inset-0 bg-gradient-to-t from-insDark/80 to-transparent"></div>
            <div class="absolute bottom-6 left-6 md:bottom-8 md:left-8">
              <h2 class="text-3xl md:text-5xl font-display font-light tracking-widest uppercase text-white mb-2">
                <span class="lang-en">${spot.name}</span>
                <span class="lang-cn">${spot.nameCn}</span>
              </h2>
              <p class="text-insAccent text-xs tracking-[0.2em] uppercase">
                <span class="lang-en">${cityData[activeCityKey].name}</span>
                <span class="lang-cn">${cityData[activeCityKey].nameCn}</span>
              </p>
            </div>
          </div>

          <div class="glass-deep rounded-2xl p-6 md:p-10 mb-8">
            <h3 class="text-lg font-medium text-white mb-4 tracking-wider">
              <span class="lang-en">About This Attraction</span>
              <span class="lang-cn">关于景点</span>
            </h3>
            <p class="text-insMuted leading-relaxed text-sm md:text-base mb-6 lang-en">${spot.detail.en}</p>
            <p class="text-insMuted leading-relaxed text-sm md:text-base mb-6 lang-cn">${spot.detail.cn}</p>

            <div class="flex flex-wrap gap-3">
              <button onclick="openSpotImgModal('${spot.img}', '${spot.name}', '${spot.nameCn}')" 
                class="glass px-4 py-2 rounded-full text-xs text-insAccent hover:bg-white/10 smooth-transition flex items-center gap-2">
                <i class="fa fa-image"></i>
                <span class="lang-en">View Image</span>
                <span class="lang-cn">查看图片</span>
              </button>
              <button onclick="openCityModal('${activeCityKey}')" 
                class="glass px-4 py-2 rounded-full text-xs text-insMuted hover:text-white hover:bg-white/10 smooth-transition flex items-center gap-2">
                <i class="fa fa-map-marker"></i>
                <span class="lang-en">Back to City</span>
                <span class="lang-cn">返回城市</span>
              </button>
            </div>
          </div>

          <!-- 相关景点推荐 -->
          <div>
            <h3 class="text-sm text-insAccent tracking-[0.2em] uppercase mb-4">
              <span class="lang-en">More in ${cityData[activeCityKey].name}</span>
              <span class="lang-cn">${cityData[activeCityKey].nameCn}更多景点</span>
            </h3>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
              ${cityData[activeCityKey].spots.filter(s => s.key !== spot.key).map(s => `
                <div class="spot-card glass rounded-lg overflow-hidden cursor-pointer" onclick="openSpotDetail('${s.key}')">
                  <div class="aspect-[16/10] overflow-hidden">
                    <img src="${s.img}" class="w-full h-full object-cover smooth-transition" 
                      onerror="this.src='https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=400&q=80'" />
                  </div>
                  <div class="p-3">
                    <p class="text-xs text-white">
                      <span class="lang-en">${s.name}</span>
                      <span class="lang-cn">${s.nameCn}</span>
                    </p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;

      // 立即应用当前语言
      const allElements = document.querySelectorAll(".lang-en, .lang-cn");
      allElements.forEach(el => {
        if (el.classList.contains('lang-en')) {
          el.style.display = currentLang === "en" ? "" : "none";
        }
        if (el.classList.contains('lang-cn')) {
          el.style.display = currentLang === "cn" ? "" : "none";
        }
      });
    }

    function openSpotDetail(spotKey) {
      activeSpotKey = spotKey;
      const spot = cityData[activeCityKey].spots.find(s => s.key === spotKey);
      if (!spot) return;

      const modal = document.getElementById("spotDetailModal");
      const bg = document.getElementById("spotDetailBg");
      bg.style.backgroundImage = `url(${spot.img})`;

      renderSpotDetail(spot);

      modal.style.opacity = "1";
      modal.style.pointerEvents = "auto";
      document.body.style.overflow = "hidden";

      // 隐藏城市弹窗但不关闭
      const cityModal = document.getElementById("cityModal");
      cityModal.style.opacity = "0";
      cityModal.style.pointerEvents = "none";
    }

    document.getElementById("closeSpotDetail").addEventListener("click", () => {
      const modal = document.getElementById("spotDetailModal");
      modal.style.opacity = "0";
      modal.style.pointerEvents = "none";
      activeSpotKey = "";

      // 恢复城市弹窗
      if (activeCityKey) {
        document.getElementById("cityModal").style.opacity = "1";
        document.getElementById("cityModal").style.pointerEvents = "auto";
      } else {
        document.body.style.overflow = "";
      }
    });

    // ==================== 景点图片预览弹窗 ====================
    function openSpotImgModal(img, nameEn, nameCn) {
      const modal = document.getElementById("spotImgModal");
      const preview = document.getElementById("spotImgPreview");
      const name = document.getElementById("spotImgName");

      preview.src = img;
      name.textContent = currentLang === "en" ? nameEn : nameCn;

      modal.style.opacity = "1";
      modal.style.pointerEvents = "auto";
    }

    document.getElementById("closeSpotImg").addEventListener("click", () => {
      const modal = document.getElementById("spotImgModal");
      modal.style.opacity = "0";
      modal.style.pointerEvents = "none";
      document.getElementById("spotImgPreview").src = "";
    });

    // 点击图片关闭
    document.getElementById("spotImgPreview").addEventListener("click", () => {
      document.getElementById("closeSpotImg").click();
    });

    // ==================== 初始化 ====================
    function init() {
      initCarousel();
      bindLangSwitch();
      updateHeroText();

      // 初始化语言显示
      const allElements = document.querySelectorAll(".lang-en, .lang-cn");
      allElements.forEach(el => {
        if (el.classList.contains('lang-en')) {
          el.style.display = currentLang === "en" ? "" : "none";
        }
        if (el.classList.contains('lang-cn')) {
          el.style.display = currentLang === "cn" ? "" : "none";
        }
      });
    }

    // 页面加载完成后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
